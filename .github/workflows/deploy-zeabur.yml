name: Deploy to Zeabur

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-zeabur
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SSH client helper
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy and verify
        env:
          SSH_HOST: ${{ secrets.ZEABUR_SSH_HOST }}
          SSH_USER: ${{ secrets.ZEABUR_SSH_USER }}
          SSHPASS: ${{ secrets.ZEABUR_SSH_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          sshpass -e scp deploy/zeabur.yaml "$SSH_USER@$SSH_HOST:/tmp/xinyao-zeabur.yaml"
          tar --exclude=node_modules --exclude=.next --exclude=.git --exclude=.env --exclude=.codex-tmp --exclude=outputs -czf /tmp/xinyao-source.tgz .
          sshpass -e scp /tmp/xinyao-source.tgz "$SSH_USER@$SSH_HOST:/tmp/xinyao-source.tgz"
          sshpass -e ssh "$SSH_USER@$SSH_HOST" 'sudo mkdir -p /opt/xinyao-source && sudo tar -xzf /tmp/xinyao-source.tgz -C /opt/xinyao-source && sudo mkdir -p /home/ubuntu/xinyao-backups && sudo k3s kubectl -n environment-6a6356942007fc25ea3603b2 exec deployment/xinyao-postgres -- pg_dump -U xinyao -d enterprise_ops -Fc > /home/ubuntu/xinyao-backups/pre-deploy-$(date +%Y%m%d-%H%M%S).dump && sudo k3s kubectl apply -f /tmp/xinyao-zeabur.yaml && sudo k3s kubectl -n environment-6a6356942007fc25ea3603b2 rollout restart deployment/xinyao-flow && sudo k3s kubectl -n environment-6a6356942007fc25ea3603b2 rollout status deployment/xinyao-flow --timeout=600s && curl --fail --silent --show-error https://xinyao-sg-08131928.zeabur.app/login >/dev/null'
