name: Deploy to Zeabur

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-zeabur
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SSH client helper
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy and verify
        env:
          SSH_HOST: ${{ secrets.ZEABUR_SSH_HOST }}
          SSH_USER: ${{ secrets.ZEABUR_SSH_USER }}
          SSHPASS: ${{ secrets.ZEABUR_SSH_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          sshpass -e ssh "$SSH_USER@$SSH_HOST" '
            set +e
            namespace=environment-6a7da4faf8fa433a2b5dfa7b
            echo "=== Pod status and restarts ==="
            sudo k3s kubectl -n "$namespace" get pods -o custom-columns="NAME:.metadata.name,PHASE:.status.phase,RESTARTS:.status.containerStatuses[0].restartCount,TERMINATION:.status.containerStatuses[0].lastState.terminated.reason"
            echo "=== Pod resource usage ==="
            sudo k3s kubectl -n "$namespace" top pods
            echo "=== Persistent volume free space ==="
            sudo k3s kubectl -n "$namespace" exec deployment/xinyao-postgres -- df -Pk /var/lib/postgresql/data | tail -1
            sudo k3s kubectl -n "$namespace" exec deployment/xinyao-flow -- df -Pk /data/uploads | tail -1
            echo "=== Recent cluster warning events ==="
            sudo k3s kubectl -n "$namespace" get events --field-selector type=Warning --sort-by=.lastTimestamp | tail -20
            echo "=== Sanitized application error-category counts (72h) ==="
            sudo k3s kubectl -n "$namespace" logs deployment/xinyao-flow --since=72h 2>&1 | grep -Eio "P[0-9]{4}|ETIMEDOUT|ECONNRESET|ECONNREFUSED|ENOSPC|ENOMEM|EPIPE|SIGTERM|SIGKILL|OOMKilled|out of memory|heap out of memory|timed? out|502|503|504|413|PrismaClient[A-Za-z]*" | sort | uniq -c
          '
          sshpass -e scp deploy/zeabur.yaml "$SSH_USER@$SSH_HOST:/tmp/xinyao-zeabur.yaml"
          tar --exclude=node_modules --exclude=.next --exclude=.git --exclude=.env --exclude=.codex-tmp --exclude=outputs -czf /tmp/xinyao-source.tgz .
          sshpass -e scp /tmp/xinyao-source.tgz "$SSH_USER@$SSH_HOST:/tmp/xinyao-source.tgz"
          sshpass -e ssh "$SSH_USER@$SSH_HOST" 'sudo mkdir -p /opt/xinyao-source && sudo rm -rf /opt/xinyao-source/.next && sudo tar -xzf /tmp/xinyao-source.tgz -C /opt/xinyao-source && sudo mkdir -p /home/ubuntu/xinyao-backups && sudo k3s kubectl -n environment-6a7da4faf8fa433a2b5dfa7b exec deployment/xinyao-postgres -- pg_dump -U xinyao -d enterprise_ops -Fc > /home/ubuntu/xinyao-backups/pre-deploy-$(date +%Y%m%d-%H%M%S).dump && sudo k3s kubectl apply -f /tmp/xinyao-zeabur.yaml && sudo k3s kubectl -n environment-6a7da4faf8fa433a2b5dfa7b rollout restart deployment/xinyao-flow && sudo k3s kubectl -n environment-6a7da4faf8fa433a2b5dfa7b rollout status deployment/xinyao-flow --timeout=600s && curl --fail --silent --show-error https://xinyao-sg-08131928.zeabur.app/login >/dev/null'
